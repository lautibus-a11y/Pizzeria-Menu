<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Pizzeria Italia | Menú Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --pizza-red: #9e1b1b;
            --pizza-yellow: #fac415;
            --pizza-dark: #0a0a0a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .font-header {
            font-family: 'Anton', sans-serif;
        }

        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        /* Patrón de Mantel de Pizzería Premium (Vichy) */
        .bg-tablecloth {
            background-color: #050505;
            background-image:
                linear-gradient(90deg, rgba(158, 27, 27, 0.025) 50%, transparent 50%),
                linear-gradient(rgba(158, 27, 27, 0.025) 50%, transparent 50%);
            background-size: 60px 60px;
        }

        /* Optimized scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInFromBottom {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .slide-in-from-bottom {
            animation: slideInFromBottom 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>

<body class="text-gray-950">
    <div id="root">
        <div
            style="background:#050505; color:white; height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; width:100%;">
            Iniciando Menú Digital...
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
